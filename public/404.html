<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Goroutine Perdida - A Filosofia de Concorrência em Go</title>
    
    <!-- Design System Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS Architecture -->
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/typography.css">
    <link rel="stylesheet" href="/styles/layout.css">
    
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at center, rgba(0, 173, 216, 0.05) 0%, var(--bg-void) 60%);
        }
        
        .error-code {
            font-family: var(--font-mono);
            font-size: 8rem;
            line-height: 1;
            color: var(--danger-red);
            text-shadow: 0 0 20px rgba(224, 62, 82, 0.2);
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-family: var(--font-editorial);
            font-size: 1.5rem;
            color: var(--text-primary);
            max-width: 600px;
            margin-bottom: 3rem;
            line-height: 1.6;
        }
        
        .error-technical {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--go-cyan);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <main class="error-container">
        <div class="error-code">404</div>
        <p class="error-technical">FATAL ERROR: panic: send on closed channel</p>
        <h1 class="error-message">A Goroutine se perdeu no canal. Nenhum processo consumidor foi encontrado nesta rota.</h1>
        
        <a href="/" class="btn-run" aria-label="Retornar à página principal">Restabelecer Conexão (Voltar ao Início)</a>
    </main>
</body>
</html>
